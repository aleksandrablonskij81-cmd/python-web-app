<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="bg-dark text-white">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-0">
                <a class="navbar-brand" href="/">Мой магазин</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/categories">Категории</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/orders">Заказы</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/contacts">Контакты</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle"></i> Пользователь
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#"><i class="bi bi-person"></i> Профиль</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right"></i> Выход</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container py-4">
        <h1 class="mb-4">Заказы</h1>
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> Здесь будет список ваших заказов.
        </div>
        <div class="list-group">
            <div class="list-group-item d-flex justify-content-between align-items-center">
                Заказ #001
                <span class="badge bg-success rounded-pill">Доставлен</span>
            </div>
            <div class="list-group-item d-flex justify-content-between align-items-center">
                Заказ #002
                <span class="badge bg-warning rounded-pill">В пути</span>
            </div>
            <div class="list-group-item d-flex justify-content-between align-items-center">
                Заказ #003
                <span class="badge bg-secondary rounded-pill">Ожидает</span>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-light text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 text-muted">&copy; 2026 Мой магазин. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
